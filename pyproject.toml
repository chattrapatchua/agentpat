[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "work-agent"
version = "0.1.0"
description = "Work Agent — shared agent core, MCP server, and web chat over ./knowledge and .cursor/workflows"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "anthropic>=0.40",
  "openai>=1.30",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
work-agent-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
