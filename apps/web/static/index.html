<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Work Agent</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1115; --panel:#181b22; --tool:#232833; --acc:#6ea8fe; --txt:#e7e9ee; --mut:#9aa4b2; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 18px; border-bottom:1px solid #262b36; display:flex; gap:10px; align-items:center; }
  header b { font-size:15px; } #status { color:var(--mut); font-size:12px; margin-left:auto; }
  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; max-width:820px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:10px; white-space:pre-wrap; word-wrap:break-word; }
  .user { background:var(--acc); color:#0a0d12; align-self:flex-end; max-width:80%; }
  .bot { background:var(--panel); align-self:flex-start; max-width:88%; }
  .tool { background:var(--tool); color:var(--mut); font:12px/1.4 ui-monospace, monospace; align-self:flex-start; max-width:88%; border-left:3px solid var(--acc); }
  .err { border-left-color:#ff6b6b; color:#ffb4b4; }
  form { display:flex; gap:8px; padding:14px 18px; border-top:1px solid #262b36; max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; padding:11px 14px; border-radius:9px; border:1px solid #2c3240; background:var(--panel); color:var(--txt); font-size:15px; }
  button { padding:11px 18px; border:0; border-radius:9px; background:var(--acc); color:#0a0d12; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
  <header><b>Work Agent</b> <span id="status">connecting…</span></header>
  <div id="log"></div>
  <form id="f">
    <input id="q" placeholder="Ask about discovery, run a workflow, search knowledge…" autocomplete="off" />
    <button id="send">Send</button>
  </form>
<script>
const log = document.getElementById('log');
const form = document.getElementById('f');
const q = document.getElementById('q');
const send = document.getElementById('send');
const sid = 'web-' + Math.random().toString(36).slice(2);

function add(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

fetch('/api/health').then(r => r.json()).then(h => {
  const s = document.getElementById('status');
  s.textContent = h.provider === 'none'
    ? '⚠ no model key — set ANTHROPIC_API_KEY or OPENAI_API_KEY in .env'
    : `${h.agent} · ${h.provider}`;
}).catch(() => {});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text) return;
  add('user', text);
  q.value = '';
  send.disabled = true;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sid }),
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.replace(/^data: /, '');
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === 'text') add('bot', ev.text);
        else if (ev.type === 'tool_call') add('tool', '→ ' + ev.name + '(' + JSON.stringify(ev.input) + ')');
        else if (ev.type === 'tool_result') add('tool' + (ev.error ? ' err' : ''), '  ' + ev.name + ' → ' + ev.result);
        else if (ev.type === 'error') add('tool err', ev.message);
      }
    }
  } catch (err) {
    add('tool err', 'request failed: ' + err);
  } finally {
    send.disabled = false;
    q.focus();
  }
});
</script>
</body>
</html>
